<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RTA Control Panel - Geist Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700;800&family=Geist:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       Vercel Geist / shadcn/ui Dark Design Tokens
       ========================================================================== */
    :root {
      --geist-bg: #000000;
      --geist-card: #0a0a0a;
      --geist-card-subtle: #121212;
      --geist-border: #262626;
      --geist-border-focus: #ededed;
      
      --geist-fg: #ededed;
      --geist-muted: #888888;
      --geist-dim: #444444;
      
      --geist-blue: #0070f3;
      --geist-cyan: #50e3c2;
      --geist-success: #00df8f;
      --geist-warning: #f5a623;
      --geist-danger: #ff0080;
      
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 16px;
      background: var(--geist-bg);
      color: var(--geist-fg);
      font-family: 'Geist', 'Noto Sans JP', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 580px;
      margin: 0 auto;
    }

    .geist-card {
      background: var(--geist-card);
      border: 1px solid var(--geist-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Geist Mono', monospace;
      color: var(--geist-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* タイマー */
    .timer-display-box {
      text-align: center;
      background: #000000;
      border: 1px solid var(--geist-border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .timer-text {
      font-family: 'Geist Mono', monospace;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -2px;
      font-feature-settings: "tnum";
      color: #fff;
    }

    .status-tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'Geist Mono', monospace;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .status-stopped { background: #171717; color: var(--geist-muted); border: 1px solid var(--geist-border); }
    .status-running { background: rgba(0, 223, 143, 0.15); color: var(--geist-success); border: 1px solid rgba(0, 223, 143, 0.3); }
    .status-paused { background: rgba(255, 0, 128, 0.15); color: var(--geist-danger); border: 1px solid rgba(255, 0, 128, 0.3); }
    .status-finished { background: rgba(245, 166, 35, 0.15); color: var(--geist-warning); border: 1px solid rgba(245, 166, 35, 0.3); }

    /* ボタングリッド */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Geist', 'Noto Sans JP', sans-serif;
      border-radius: var(--radius);
      border: 1px solid var(--geist-border);
      background: var(--geist-card-subtle);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #1f1f1f;
      border-color: var(--geist-border-focus);
    }
    button:active { transform: scale(0.98); }

    .btn-primary { background: #ededed; color: #000; font-weight: 700; border-color: #ededed; }
    .btn-primary:hover { background: #ffffff; }

    .btn-action-start { background: var(--geist-success); color: #000; font-weight: 700; border-color: var(--geist-success); }
    .btn-action-start:hover { filter: brightness(1.1); }

    .btn-action-finish { background: var(--geist-warning); color: #000; font-weight: 700; border-color: var(--geist-warning); }
    .btn-action-finish:hover { filter: brightness(1.1); }

    /* レイアウト切り替え */
    .layout-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-layout.active {
      background: var(--geist-fg);
      color: #000;
      font-weight: 700;
      border-color: var(--geist-fg);
    }

    /* フォーム */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 11px;
      font-family: 'Geist Mono', monospace;
      color: var(--geist-muted);
      font-weight: 600;
    }

    input, select, textarea {
      background: #000000;
      border: 1px solid var(--geist-border);
      border-radius: var(--radius);
      padding: 8px 10px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--geist-border-focus);
    }

    .nav-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    details {
      background: var(--geist-card);
      border: 1px solid var(--geist-border);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    summary {
      cursor: pointer;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--geist-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. タイマー操作 -->
    <div class="geist-card">
      <div class="card-header">
        <span>TIMER CONTROL</span>
        <span id="timerStatus" class="status-tag status-stopped">STOPPED</span>
      </div>
      
      <div class="timer-display-box">
        <div class="timer-text" id="timerDisplay">00:00:00</div>
      </div>

      <div class="btn-grid">
        <button class="btn-action-start" onclick="nodecg.sendMessage('startTimer')">▶ START</button>
        <button onclick="nodecg.sendMessage('pauseTimer')">⏸ PAUSE</button>
        <button class="btn-action-finish" onclick="nodecg.sendMessage('finishTimer')">🏁 FINISH</button>
        <button onclick="nodecg.sendMessage('resetTimer')">🔄 RESET</button>
      </div>
    </div>

    <!-- 2. レイアウト切り替え -->
    <div class="geist-card">
      <div class="card-header">
        <span>LAYOUT PRESET</span>
        <span id="currentLayoutText" style="color: #fff;">16:9</span>
      </div>
      <div class="layout-group">
        <button class="btn-layout active" id="btnLayout169" onclick="setLayout('16:9')">16:9 ワイド</button>
        <button class="btn-layout" id="btnLayout43" onclick="setLayout('4:3')">4:3 レトロ</button>
        <button class="btn-layout" id="btnLayoutSetup" onclick="setLayout('setup')">待機 / 予告</button>
      </div>
    </div>

    <!-- 3. 走者＆ゲーム情報 -->
    <div class="geist-card">
      <div class="card-header">
        <span>RUN DETAILS</span>
        <span id="scheduleProgress" style="color: #fff;">1 / 2</span>
      </div>

      <div class="form-group full">
        <label>SCHEDULE SELECT</label>
        <select id="scheduleSelect" onchange="onScheduleSelect(this.value)">
          <option value="0">Loading...</option>
        </select>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>GAME TITLE</label>
          <input type="text" id="inpGameTitle" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>CATEGORY</label>
          <input type="text" id="inpGameCategory" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>EST TIME</label>
          <input type="text" id="inpGameEst" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>RUNNER</label>
          <input type="text" id="inpRunnerName" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>COMMENTATOR</label>
          <input type="text" id="inpCommentatorName" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>PLATFORM</label>
          <input type="text" id="inpGamePlatform" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>ASPECT RATIO</label>
          <select id="inpGameAspect" onchange="saveRunChanges()">
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
          </select>
        </div>
      </div>

      <div class="nav-btn-row">
        <button onclick="nodecg.sendMessage('prevRun')">◀ PREV RUN</button>
        <button class="btn-primary" onclick="nodecg.sendMessage('nextRun')">NEXT RUN ▶</button>
      </div>
    </div>

    <!-- 4. イベント設定 -->
    <details>
      <summary>⚙️ EVENT METADATA</summary>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
        <div class="form-group">
          <label>EVENT NAME</label>
          <input type="text" id="inpEventName" onchange="saveEventInfo()">
        </div>
        <div class="form-group">
          <label>HASHTAG</label>
          <input type="text" id="inpEventHashtag" onchange="saveEventInfo()">
        </div>
      </div>
    </details>

    <!-- 5. JSONインポート -->
    <details>
      <summary>📋 SCHEDULE JSON IMPORT</summary>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
        <textarea id="importJsonArea" rows="4" placeholder='[ { "game": { "title": "Game Name" } } ]'></textarea>
        <button class="btn-primary" onclick="importSchedule()">IMPORT TO SCHEDULE</button>
      </div>
    </details>

  </div>

  <script>
    const scheduleRep = nodecg.Replicant('schedule');
    const currentRunIndexRep = nodecg.Replicant('currentRunIndex');
    const currentRunRep = nodecg.Replicant('currentRun');
    const timerRep = nodecg.Replicant('timer');
    const layoutRep = nodecg.Replicant('layout');
    const eventInfoRep = nodecg.Replicant('eventInfo');

    // 1. タイマー
    timerRep.on('change', (val) => {
      if (!val) return;
      document.getElementById('timerDisplay').innerText = val.formatted || '00:00:00';
      const statusEl = document.getElementById('timerStatus');
      statusEl.innerText = val.status.toUpperCase();
      statusEl.className = 'status-tag status-' + val.status;
    });

    // 2. レイアウト
    layoutRep.on('change', (layout) => {
      document.getElementById('currentLayoutText').innerText = layout || '16:9';
      document.querySelectorAll('.btn-layout').forEach(b => b.classList.remove('active'));
      if (layout === '16:9') document.getElementById('btnLayout169')?.classList.add('active');
      if (layout === '4:3') document.getElementById('btnLayout43')?.classList.add('active');
      if (layout === 'setup') document.getElementById('btnLayoutSetup')?.classList.add('active');
    });

    function setLayout(layout) {
      nodecg.sendMessage('setLayout', layout);
    }

    // 3. 走者＆ゲーム情報
    currentRunRep.on('change', (run) => {
      if (!run) return;
      document.getElementById('inpGameTitle').value = run.game?.title || '';
      document.getElementById('inpGameCategory').value = run.game?.category || '';
      document.getElementById('inpGameEst').value = run.game?.est || '';
      document.getElementById('inpRunnerName').value = run.runner?.name || '';
      document.getElementById('inpCommentatorName').value = run.commentator?.name || (typeof run.commentator === 'string' ? run.commentator : '');
      document.getElementById('inpGamePlatform').value = run.game?.platform || '';
      document.getElementById('inpGameAspect').value = run.game?.aspect_ratio || '16:9';
    });

    // 4. スケジュールドロップダウン
    scheduleRep.on('change', (list) => {
      const select = document.getElementById('scheduleSelect');
      select.innerHTML = '';
      if (!list || list.length === 0) {
        select.innerHTML = '<option value="0">No Runs</option>';
        return;
      }
      list.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `[#${idx+1}] ${item.game?.title || '-'} (${item.runner?.name || '-'})`;
        select.appendChild(opt);
      });
      if (currentRunIndexRep.value !== undefined) {
        select.value = currentRunIndexRep.value;
      }
    });

    currentRunIndexRep.on('change', (idx) => {
      const total = scheduleRep.value ? scheduleRep.value.length : 0;
      document.getElementById('scheduleProgress').innerText = `${idx + 1} / ${total}`;
      const select = document.getElementById('scheduleSelect');
      if (select) select.value = idx;
    });

    function onScheduleSelect(idx) {
      nodecg.sendMessage('jumpToRun', parseInt(idx, 10));
    }

    function saveRunChanges() {
      const cur = currentRunRep.value || { game: {}, runner: {} };
      const updated = {
        ...cur,
        game: {
          ...cur.game,
          title: document.getElementById('inpGameTitle').value,
          category: document.getElementById('inpGameCategory').value,
          est: document.getElementById('inpGameEst').value,
          platform: document.getElementById('inpGamePlatform').value,
          aspect_ratio: document.getElementById('inpGameAspect').value
        },
        runner: {
          ...cur.runner,
          name: document.getElementById('inpRunnerName').value
        },
        commentator: {
          name: document.getElementById('inpCommentatorName').value
        }
      };
      nodecg.sendMessage('updateCurrentRunData', updated);
    }

    // 5. イベント情報
    eventInfoRep.on('change', (info) => {
      if (!info) return;
      document.getElementById('inpEventName').value = info.name || '';
      document.getElementById('inpEventHashtag').value = info.hashtag || '';
    });

    function saveEventInfo() {
      nodecg.sendMessage('updateEventInfo', {
        name: document.getElementById('inpEventName').value,
        hashtag: document.getElementById('inpEventHashtag').value
      });
    }

    // 6. JSONインポート
    function importSchedule() {
      const text = document.getElementById('importJsonArea').value.trim();
      if (!text) { alert('JSONを入力してください'); return; }
      nodecg.sendMessage('importSchedule', text, (err, res) => {
        if (err) alert('エラー: ' + err.message);
        else alert(`成功！ ${res.count} 件の走者を反映しました。`);
      });
    }
  </script>
</body>
</html>
