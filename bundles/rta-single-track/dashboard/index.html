<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RTA Control Panel - DADS Official Resources Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Noto+Sans+JP:wght@400;600;700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       DADS 公式 UI コンポーネント トークン (Dashboard)
       ========================================================================== */
    :root {
      --dads-bg: #f1f5f9;
      --dads-card: #ffffff;
      --dads-border: #cbd5e1;
      --dads-border-focus: #004ea2;
      
      --dads-blue-900: #004ea2;     /* デジ庁ブルー */
      --dads-blue-hover: #003875;
      --dads-text-main: #0f172a;
      --dads-text-muted: #475569;
      
      --dads-green-800: #047857;
      --dads-gold-800: #b45309;
      --dads-red-800: #be123c;
      
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 16px;
      background: var(--dads-bg);
      color: var(--dads-text-main);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 580px;
      margin: 0 auto;
    }

    .ui-card {
      background: var(--dads-card);
      border: 1.5px solid var(--dads-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--dads-blue-900);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* タイマー */
    .timer-display-box {
      text-align: center;
      background: #f8fafc;
      border: 2px solid var(--dads-border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .timer-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1px;
      font-feature-settings: "tnum";
      color: var(--dads-text-main);
    }

    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .status-stopped { background: #e2e8f0; color: #475569; }
    .status-running { background: #d1fae5; color: var(--dads-green-800); border: 1px solid #a7f3d0; }
    .status-paused { background: #ffe4e6; color: var(--dads-red-800); border: 1px solid #fecdd3; }
    .status-finished { background: #fef3c7; color: var(--dads-gold-800); border: 1px solid #fde68a; }

    /* ボタングリッド */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      border-radius: var(--radius);
      border: 1.5px solid var(--dads-border);
      background: #ffffff;
      color: var(--dads-text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover { background: #f8fafc; border-color: var(--dads-blue-900); }
    button:active { transform: scale(0.98); }

    .btn-start { background: var(--dads-green-800); color: #ffffff; border-color: var(--dads-green-800); }
    .btn-start:hover { background: #03543f; }

    .btn-finish { background: var(--dads-gold-800); color: #ffffff; border-color: var(--dads-gold-800); }
    .btn-finish:hover { background: #8e3e07; }

    .btn-primary { background: var(--dads-blue-900); color: #ffffff; border-color: var(--dads-blue-900); }
    .btn-primary:hover { background: var(--dads-blue-hover); }

    /* レイアウト切り替え */
    .layout-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-layout.active {
      background: var(--dads-blue-900);
      color: #ffffff;
      font-weight: 800;
      border-color: var(--dads-blue-900);
    }

    /* フォーム */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 11px;
      font-weight: 700;
      color: var(--dads-text-muted);
    }

    input, select, textarea {
      background: #ffffff;
      border: 1.5px solid var(--dads-border);
      border-radius: var(--radius);
      padding: 8px 10px;
      color: var(--dads-text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--dads-border-focus);
    }

    .nav-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    details {
      background: var(--dads-card);
      border: 1.5px solid var(--dads-border);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    summary {
      cursor: pointer;
      font-weight: 800;
      font-size: 11px;
      color: var(--dads-text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. タイマー操作 -->
    <div class="ui-card">
      <div class="card-header">
        <span>⏱️ タイマー操作</span>
        <span id="timerStatus" class="status-tag status-stopped">STOPPED</span>
      </div>
      
      <div class="timer-display-box">
        <div class="timer-text" id="timerDisplay">00:00:00</div>
      </div>

      <div class="btn-grid" id="timerControlButtons">
        <button class="btn-start" onclick="nodecg.sendMessage('startTimer')">▶ 開始 (START)</button>
        <button onclick="nodecg.sendMessage('pauseTimer')">⏸ 一時停止</button>
        <button class="btn-finish" onclick="nodecg.sendMessage('finishTimer')">🏁 完走 (FINISH)</button>
        <button onclick="nodecg.sendMessage('resetTimer')">🔄 リセット</button>
      </div>

      <div id="timerSourceHint" style="display: none; font-size: 11px; font-weight: 700; color: var(--dads-green-800); text-align: center;">
        ✅ LiveSplit と同期中（手動操作は無効）
      </div>
    </div>

    <!-- 2. 画面レイアウト -->
    <div class="ui-card">
      <div class="card-header">
        <span>📺 画面レイアウト切り替え</span>
        <span id="currentLayoutText" style="color: var(--dads-blue-900);">16:9</span>
      </div>
      <div class="layout-group">
        <button class="btn-layout active" id="btnLayout169" onclick="setLayout('16:9')">16:9 ワイド</button>
        <button class="btn-layout" id="btnLayout43" onclick="setLayout('4:3')">4:3 レトロ</button>
        <button class="btn-layout" id="btnLayoutSetup" onclick="setLayout('setup')">待機 / 予告</button>
      </div>
    </div>

    <!-- 3. DADS 公式 お知らせバナー発信 -->
    <div class="ui-card">
      <div class="card-header">
        <span>📢 DADS 公式お知らせバナー (速報テロップ)</span>
      </div>
      <div class="form-group">
        <label>画面に流すアナウンス文</label>
        <input type="text" id="inpAnnouncementText" onchange="saveAnnouncement()">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-primary" style="flex: 1;" onclick="saveAnnouncement()">バナーを更新・反映</button>
        <button onclick="toggleAnnouncementVisibility()" id="btnToggleBanner">バナー非表示</button>
      </div>
    </div>

    <!-- 4. 走者＆ゲーム情報 -->
    <div class="ui-card">
      <div class="card-header">
        <span>🎮 走者・作品情報</span>
        <span id="scheduleProgress" style="color: var(--dads-blue-900);">1 / 2</span>
      </div>

      <div class="form-group full">
        <label>スケジュールから選択</label>
        <select id="scheduleSelect" onchange="onScheduleSelect(this.value)">
          <option value="0">読み込み中...</option>
        </select>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>作品名 (ゲームタイトル)</label>
          <input type="text" id="inpGameTitle" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <input type="text" id="inpGameCategory" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>予定タイム (EST)</label>
          <input type="text" id="inpGameEst" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>走者名</label>
          <input type="text" id="inpRunnerName" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>解説者名</label>
          <input type="text" id="inpCommentatorName" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>プレイ機種</label>
          <input type="text" id="inpGamePlatform" onchange="saveRunChanges()">
        </div>
        <div class="form-group">
          <label>画面比率</label>
          <select id="inpGameAspect" onchange="saveRunChanges()">
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
          </select>
        </div>
      </div>

      <div class="nav-btn-row">
        <button onclick="nodecg.sendMessage('prevRun')">◀ 前の走者</button>
        <button class="btn-primary" onclick="nodecg.sendMessage('nextRun')">次の走者 (NEXT) ▶</button>
      </div>
    </div>

    <!-- 5. イベント設定 -->
    <details>
      <summary>⚙️ イベント情報 (タイトル・ハッシュタグ)</summary>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
        <div class="form-group">
          <label>イベント名</label>
          <input type="text" id="inpEventName" onchange="saveEventInfo()">
        </div>
        <div class="form-group">
          <label>公式ハッシュタグ</label>
          <input type="text" id="inpEventHashtag" onchange="saveEventInfo()">
        </div>
      </div>
    </details>

    <!-- 6. JSONインポート -->
    <details>
      <summary>📋 スケジュールJSON一括読み込み</summary>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
        <textarea id="importJsonArea" rows="4" placeholder='[ { "game": { "title": "Game Name" } } ]'></textarea>
        <button class="btn-primary" onclick="importSchedule()">スケジュールに反映</button>
      </div>
    </details>

    <!-- 7. LiveSplit 自動連携 -->
    <div class="ui-card">
      <div class="card-header">
        <span>⏱️ LiveSplit 自動連携</span>
        <span id="lsStatus" class="status-tag status-stopped">未接続</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>ホスト</label>
          <input type="text" id="lsHost" onchange="saveLiveSplitConfig()">
        </div>
        <div class="form-group">
          <label>ポート</label>
          <input type="number" id="lsPort" onchange="saveLiveSplitConfig()">
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-primary" style="flex: 1;" onclick="lsConnect()">🔌 接続</button>
        <button style="flex: 1;" onclick="lsDisconnect()">切断</button>
      </div>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="lsUseAsTimer" onchange="saveLiveSplitConfig()"> タイマー表示を LiveSplit に同期
      </label>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="lsAutoConnect" onchange="saveLiveSplitConfig()"> 起動時に自動接続
      </label>
      <div id="lsSplitInfo" style="font-size: 11px; color: var(--dads-text-muted); line-height: 1.5;">
        未接続です。LiveSplit の「右クリック → Control → Start TCP Server」を起動してから接続してね。
      </div>
    </div>

    <!-- 8. VODチャプター自動生成 -->
    <div class="ui-card">
      <div class="card-header">
        <span>🎬 VODチャプター自動生成</span>
        <span id="vodCount" style="color: var(--dads-blue-900);">0 件</span>
      </div>
      <div class="form-group">
        <label>配信開始時刻（任意 / 例: 2026-09-05T13:00:00+09:00）</label>
        <input type="text" id="vodStart" placeholder="未入力なら最初の走者を 0:00 にします">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-primary" style="flex: 1;" onclick="generateVodChapters()">📝 チャプター生成</button>
        <button style="flex: 1;" onclick="clearActualTimes()">実走記録をクリア</button>
      </div>
      <textarea id="vodOutput" rows="6" readonly placeholder="ここに Twitch / YouTube 用チャプターが出力されます"></textarea>
      <button onclick="copyVodChapters()">📋 クリップボードにコピー</button>
    </div>

    <!-- 9. 事故検知アラート -->
    <div class="ui-card">
      <div class="card-header">
        <span>🚨 事故検知アラート</span>
        <span id="alertStatus" class="status-tag status-stopped">OFF</span>
      </div>
      <div class="form-group">
        <label>Discord Webhook URL</label>
        <input type="password" id="alertWebhook" placeholder="https://discord.com/api/webhooks/..." onchange="saveAlertsConfig()">
      </div>
      <div class="form-group">
        <label>メンション（任意 / 例: @here や &lt;@&amp;ロールID&gt;）</label>
        <input type="text" id="alertMention" onchange="saveAlertsConfig()">
      </div>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="alertEnabled" onchange="saveAlertsConfig()"> Discord 通知を有効化
      </label>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="alertLsDisc" onchange="saveAlertsConfig()"> LiveSplit 切断を通知
      </label>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="alertOverrun" onchange="saveAlertsConfig()"> 予定タイム超過を通知
      </label>
      <div class="form-group">
        <label>超過アラート閾値 (%)</label>
        <input type="number" id="alertOverrunPct" onchange="saveAlertsConfig()">
      </div>
      <label style="display: flex; gap: 8px; align-items: center; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="alertReminder" onchange="saveAlertsConfig()"> 出走リマインドを通知
      </label>
      <div class="form-group">
        <label>リマインド（何分前）</label>
        <input type="number" id="alertReminderMin" onchange="saveAlertsConfig()">
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-primary" style="flex: 1;" onclick="sendTestAlert()">🔔 テスト送信</button>
        <button class="btn-finish" style="flex: 1;" onclick="sendSos()">🆘 SOS送信</button>
      </div>
    </div>

  </div>

  <script>
    const scheduleRep = nodecg.Replicant('schedule');
    const currentRunIndexRep = nodecg.Replicant('currentRunIndex');
    const currentRunRep = nodecg.Replicant('currentRun');
    const timerRep = nodecg.Replicant('timer');
    const layoutRep = nodecg.Replicant('layout');
    const eventInfoRep = nodecg.Replicant('eventInfo');
    const announcementRep = nodecg.Replicant('announcement');
    const livesplitRep = nodecg.Replicant('livesplit');
    const alertsRep = nodecg.Replicant('alerts');
    const vodChaptersRep = nodecg.Replicant('vodChapters');

    // 1. タイマー
    timerRep.on('change', (val) => {
      if (!val) return;
      document.getElementById('timerDisplay').innerText = val.formatted || '00:00:00';
      const statusEl = document.getElementById('timerStatus');
      statusEl.innerText = val.status.toUpperCase();
      statusEl.className = 'status-tag status-' + val.status;
    });

    // 2. レイアウト
    layoutRep.on('change', (layout) => {
      document.getElementById('currentLayoutText').innerText = layout || '16:9';
      document.querySelectorAll('.btn-layout').forEach(b => b.classList.remove('active'));
      if (layout === '16:9') document.getElementById('btnLayout169')?.classList.add('active');
      if (layout === '4:3') document.getElementById('btnLayout43')?.classList.add('active');
      if (layout === 'setup') document.getElementById('btnLayoutSetup')?.classList.add('active');
    });

    function setLayout(layout) {
      nodecg.sendMessage('setLayout', layout);
    }

    // 3. お知らせバナー
    announcementRep.on('change', (ann) => {
      if (!ann) return;
      document.getElementById('inpAnnouncementText').value = ann.text || '';
      const btn = document.getElementById('btnToggleBanner');
      btn.innerText = ann.visible ? 'バナー非表示' : 'バナー表示';
    });

    function saveAnnouncement() {
      const cur = announcementRep.value || { text: '', visible: true, type: 'info' };
      nodecg.sendMessage('updateAnnouncement', {
        ...cur,
        text: document.getElementById('inpAnnouncementText').value
      });
    }

    function toggleAnnouncementVisibility() {
      const cur = announcementRep.value || { text: '', visible: true, type: 'info' };
      nodecg.sendMessage('updateAnnouncement', {
        ...cur,
        visible: !cur.visible
      });
    }

    // 4. 走者＆ゲーム情報
    currentRunRep.on('change', (run) => {
      if (!run) return;
      document.getElementById('inpGameTitle').value = run.game?.title || '';
      document.getElementById('inpGameCategory').value = run.game?.category || '';
      document.getElementById('inpGameEst').value = run.game?.est || '';
      document.getElementById('inpRunnerName').value = run.runner?.name || '';
      document.getElementById('inpCommentatorName').value = run.commentator?.name || (typeof run.commentator === 'string' ? run.commentator : '');
      document.getElementById('inpGamePlatform').value = run.game?.platform || '';
      document.getElementById('inpGameAspect').value = run.game?.aspect_ratio || '16:9';
    });

    // 5. スケジュールドロップダウン
    scheduleRep.on('change', (list) => {
      const select = document.getElementById('scheduleSelect');
      select.innerHTML = '';
      if (!list || list.length === 0) {
        select.innerHTML = '<option value="0">出走者なし</option>';
        return;
      }
      list.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `[#${idx+1}] ${item.game?.title || '-'} (${item.runner?.name || '-'})`;
        select.appendChild(opt);
      });
      if (currentRunIndexRep.value !== undefined) {
        select.value = currentRunIndexRep.value;
      }
    });

    currentRunIndexRep.on('change', (idx) => {
      const total = scheduleRep.value ? scheduleRep.value.length : 0;
      document.getElementById('scheduleProgress').innerText = `${idx + 1} / ${total}`;
      const select = document.getElementById('scheduleSelect');
      if (select) select.value = idx;
    });

    function onScheduleSelect(idx) {
      nodecg.sendMessage('jumpToRun', parseInt(idx, 10));
    }

    function saveRunChanges() {
      const cur = currentRunRep.value || { game: {}, runner: {} };
      const updated = {
        ...cur,
        game: {
          ...cur.game,
          title: document.getElementById('inpGameTitle').value,
          category: document.getElementById('inpGameCategory').value,
          est: document.getElementById('inpGameEst').value,
          platform: document.getElementById('inpGamePlatform').value,
          aspect_ratio: document.getElementById('inpGameAspect').value
        },
        runner: {
          ...cur.runner,
          name: document.getElementById('inpRunnerName').value
        },
        commentator: {
          name: document.getElementById('inpCommentatorName').value
        }
      };
      nodecg.sendMessage('updateCurrentRunData', updated);
    }

    // 6. イベント情報
    eventInfoRep.on('change', (info) => {
      if (!info) return;
      document.getElementById('inpEventName').value = info.name || '';
      document.getElementById('inpEventHashtag').value = info.hashtag || '';
    });

    function saveEventInfo() {
      nodecg.sendMessage('updateEventInfo', {
        name: document.getElementById('inpEventName').value,
        hashtag: document.getElementById('inpEventHashtag').value
      });
    }

    // 7. JSONインポート
    function importSchedule() {
      const text = document.getElementById('importJsonArea').value.trim();
      if (!text) { alert('JSONを入力してください'); return; }
      nodecg.sendMessage('importSchedule', text, (err, res) => {
        if (err) alert('エラー: ' + err.message);
        else alert(`成功！ ${res.count} 件の走者を反映しました。`);
      });
    }

    // 8. LiveSplit 連携
    livesplitRep.on('change', (ls) => {
      if (!ls) return;
      document.getElementById('lsHost').value = ls.host || '';
      document.getElementById('lsPort').value = ls.port || '';
      document.getElementById('lsUseAsTimer').checked = !!ls.useAsTimerSource;
      document.getElementById('lsAutoConnect').checked = !!ls.autoConnect;

      const statusEl = document.getElementById('lsStatus');
      if (ls.connected) {
        statusEl.innerText = '接続中';
        statusEl.className = 'status-tag status-running';
      } else {
        statusEl.innerText = '未接続';
        statusEl.className = 'status-tag status-stopped';
      }

      const infoEl = document.getElementById('lsSplitInfo');
      if (ls.connected) {
        const splitText = ls.splitCount > 0 ? `${ls.splitIndex + 1} / ${ls.splitCount} (${ls.splitName || '-'})` : 'スプリット未読み込み';
        infoEl.innerText = `状態: ${ls.phase} ｜ スプリット: ${splitText}`;
      } else {
        infoEl.innerText = '未接続です。LiveSplit の「右クリック → Control → Start TCP Server」を起動してから接続してね。';
      }

      // 同期中は手動タイマー操作を無効化
      const synced = ls.useAsTimerSource && ls.connected;
      const hint = document.getElementById('timerSourceHint');
      hint.style.display = synced ? 'block' : 'none';
      document.querySelectorAll('#timerControlButtons button').forEach((b) => {
        b.disabled = synced;
        b.style.opacity = synced ? '0.45' : '1';
        b.style.cursor = synced ? 'not-allowed' : 'pointer';
      });
    });

    function saveLiveSplitConfig() {
      nodecg.sendMessage('updateLiveSplitConfig', {
        host: document.getElementById('lsHost').value.trim(),
        port: Number(document.getElementById('lsPort').value),
        useAsTimerSource: document.getElementById('lsUseAsTimer').checked,
        autoConnect: document.getElementById('lsAutoConnect').checked
      });
    }

    function lsConnect() { nodecg.sendMessage('livesplitConnect'); }
    function lsDisconnect() { nodecg.sendMessage('livesplitDisconnect'); }

    // 9. VODチャプター
    vodChaptersRep.on('change', (v) => {
      if (!v) return;
      document.getElementById('vodOutput').value = v.text || '';
      const count = v.text ? v.text.split('\n').filter((l) => l.trim()).length : 0;
      document.getElementById('vodCount').innerText = `${count} 件`;
    });

    function generateVodChapters() {
      nodecg.sendMessage('generateVodChapters', {
        vodStartIso: document.getElementById('vodStart').value.trim()
      }, (err, res) => {
        if (err) { alert('生成エラー: ' + err.message); return; }
        if (res && res.warnings && res.warnings.length > 0) {
          alert('注意:\n' + res.warnings.join('\n'));
        }
      });
    }

    function clearActualTimes() {
      if (!confirm('実走開始・終了の記録をすべて消去します。よろしいですか？')) return;
      nodecg.sendMessage('clearActualTimes', (err) => {
        if (err) alert('エラー: ' + err.message);
      });
    }

    function copyVodChapters() {
      const text = document.getElementById('vodOutput').value;
      if (!text) { alert('先にチャプターを生成してください'); return; }
      navigator.clipboard.writeText(text).then(
        () => alert('クリップボードにコピーしました！'),
        () => alert('コピーに失敗しました。手動で選択してコピーしてください。')
      );
    }

    // 10. 事故検知アラート
    alertsRep.on('change', (a) => {
      if (!a) return;
      document.getElementById('alertWebhook').value = a.discordWebhookUrl || '';
      document.getElementById('alertMention').value = a.discordMention || '';
      document.getElementById('alertEnabled').checked = !!a.discordEnabled;
      document.getElementById('alertLsDisc').checked = !!a.livesplitDisconnect;
      document.getElementById('alertOverrun').checked = !!a.runOverrun;
      document.getElementById('alertOverrunPct').value = a.overrunThresholdPercent;
      document.getElementById('alertReminder').checked = !!a.scheduleReminder;
      document.getElementById('alertReminderMin').value = a.scheduleReminderMinutes;

      const statusEl = document.getElementById('alertStatus');
      if (a.discordEnabled && a.discordWebhookUrl) {
        statusEl.innerText = 'ON';
        statusEl.className = 'status-tag status-running';
      } else {
        statusEl.innerText = 'OFF';
        statusEl.className = 'status-tag status-stopped';
      }
    });

    function saveAlertsConfig() {
      nodecg.sendMessage('updateAlertsConfig', {
        discordWebhookUrl: document.getElementById('alertWebhook').value.trim(),
        discordMention: document.getElementById('alertMention').value.trim(),
        discordEnabled: document.getElementById('alertEnabled').checked,
        livesplitDisconnect: document.getElementById('alertLsDisc').checked,
        runOverrun: document.getElementById('alertOverrun').checked,
        overrunThresholdPercent: Number(document.getElementById('alertOverrunPct').value),
        scheduleReminder: document.getElementById('alertReminder').checked,
        scheduleReminderMinutes: Number(document.getElementById('alertReminderMin').value)
      });
    }

    function sendTestAlert() { nodecg.sendMessage('sendTestAlert'); }

    function sendSos() {
      const text = prompt('SOSメッセージ（任意）', '') || '';
      nodecg.sendMessage('sendSos', { text });
    }
  </script>
</body>
</html>
