<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RTA Speedrun Broadcast - DADS Official Resources Edition</title>
  <!-- Google Fonts: Noto Sans JP (太字900・特大可読性), Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Noto+Sans+JP:wght@600;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       デジタル庁デザインシステム (DADS) 公式リソース完全準拠
       - 準拠: https://design.digital.go.jp/dads/
       - Notification Banner / Tag / Definition List / Universal Mega Tokens
       ========================================================================== */
    :root {
      /* DADS 公式カラー */
      --dads-color-bg: #cbd5e1;
      --dads-color-surface: #ffffff;
      --dads-color-surface-subtle: #f8fafc;
      --dads-color-border: #94a3b8;
      --dads-color-border-strong: #475569;
      
      --dads-blue-900: #004ea2;     /* デジ庁ブルー */
      --dads-blue-100: #dbeafe;
      --dads-blue-50: #eff6ff;
      
      --dads-green-800: #047857;    /* 進行中 (Running) */
      --dads-green-100: #d1fae5;
      
      --dads-gold-800: #b45309;     /* 完走 (Finished) */
      --dads-gold-100: #fef3c7;
      
      --dads-red-800: #be123c;      /* 停止・注意 (Alert) */
      --dads-red-100: #ffe4e6;
      
      --dads-text-primary: #0f172a; /* 墨色 (コントラスト比最大) */
      --dads-text-secondary: #334155;
      --dads-text-muted: #64748b;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      color: var(--dads-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* 1920x1080 ピクセルパーフェクト グリッド (外周20px / 隙間16px) */
    .overlay-viewport {
      width: 1920px;
      height: 1080px;
      padding: 20px;
      background: var(--dads-color-bg);
      display: grid;
      grid-template-columns: 1440px 424px;
      gap: 16px;
      position: relative;
    }

    /* DADS 公式カードスタイル */
    .dads-card {
      background: var(--dads-color-surface);
      border: 2.5px solid var(--dads-color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* DADS 公式タグコンポーネント (Tag / Badge) */
    .dads-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Noto Sans JP', 'Outfit', sans-serif;
    }

    .tag-blue { background: var(--dads-blue-100); color: var(--dads-blue-900); border: 2px solid #93c5fd; }
    .tag-green { background: var(--dads-green-100); color: var(--dads-green-800); border: 2px solid #6ee7b7; }
    .tag-gold { background: var(--dads-gold-100); color: var(--dads-gold-800); border: 2px solid #fcd34d; }
    .tag-red { background: var(--dads-red-100); color: var(--dads-red-800); border: 2px solid #fda4af; }

    /* DADS 公式アイコンラッパー */
    .dads-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .dads-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* ===================================================
       左カラム (幅1440px × 高さ1040px)
       =================================================== */
    .left-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 1040px;
    }

    /* ゲーム画面枠 (1440x810 16:9最大化) */
    #gameScreenWrapper {
      width: 1440px;
      height: 810px;
      background: #000;
      border: 3.5px solid #1e293b;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
      flex-shrink: 0;
      position: relative;
    }

    /* 4:3 レトロ時 */
    .layout-4-3 #gameScreenWrapper {
      width: 1080px;
      height: 810px;
    }

    /* 左下フッター (1440x214 下端完全一致！) */
    .bottom-bar {
      flex: 1;
      height: 214px;
      display: flex;
      gap: 16px;
    }

    /* イベント情報 ＆ DADS 公式 Notification Banner */
    .event-info-card {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 8px solid var(--dads-blue-900);
    }

    .event-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--dads-blue-900);
      letter-spacing: -0.4px;
    }

    .event-hashtag {
      font-size: 18px;
      color: var(--dads-text-secondary);
      font-weight: 800;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
    }

    /* DADS 公式 Notification Banner コンポーネント */
    .dads-notification-banner {
      background: var(--dads-blue-50);
      border: 2px solid #bfdbfe;
      border-left: 6px solid var(--dads-blue-900);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dads-notification-banner__icon {
      color: var(--dads-blue-900);
      width: 28px;
      height: 28px;
    }

    .dads-notification-banner__text {
      font-size: 15px;
      font-weight: 800;
      color: var(--dads-text-primary);
      line-height: 1.4;
    }

    /* 走者カメラ / 手元小窓 */
    .camera-card {
      width: 300px;
      height: 100%;
      background: #f8fafc;
      border: 2.5px dashed var(--dads-color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--dads-text-muted);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* ===================================================
       右カラム (サイドバー: 幅424px × 高さ1040px 下端完全一致！)
       =================================================== */
    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 1040px;
    }

    /* 1. タイマーカード (特大70px) */
    .timer-card {
      padding: 16px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 6px solid var(--dads-blue-900);
    }

    .timer-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 70px;
      font-weight: 900;
      letter-spacing: -2px;
      font-feature-settings: "tnum";
      color: var(--dads-text-primary);
      margin: 2px 0;
      transition: color 0.2s ease;
    }

    .timer-running .timer-value { color: var(--dads-green-800); }
    .timer-running { border-top-color: var(--dads-green-800); }
    .timer-finished .timer-value { color: var(--dads-gold-800); }
    .timer-finished { border-top-color: var(--dads-gold-800); }
    .timer-paused .timer-value { color: var(--dads-red-800); }
    .timer-paused { border-top-color: var(--dads-red-800); }

    /* 2. ゲーム＆走者情報カード */
    .info-card {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-title-text {
      font-size: 30px;
      font-weight: 900;
      color: var(--dads-text-primary);
      line-height: 1.25;
      margin-top: 6px;
      letter-spacing: -0.6px;
    }

    .game-category-text {
      font-size: 18px;
      font-weight: 800;
      color: var(--dads-blue-900);
    }

    /* プロファイル行 (走者 & 解説者) */
    .profile-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--dads-color-surface-subtle);
      border: 2px solid var(--dads-color-border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
    }

    .profile-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--dads-blue-100);
      color: var(--dads-blue-900);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .profile-role-tag {
      font-size: 13px;
      font-weight: 900;
      color: var(--dads-text-muted);
      text-transform: uppercase;
    }

    .profile-name-text {
      font-size: 24px;
      font-weight: 900;
      color: var(--dads-text-primary);
      letter-spacing: -0.3px;
    }

    /* DADS 公式 Definition List (定義リスト) */
    .dads-definition-list {
      background: #f8fafc;
      border: 2px solid var(--dads-color-border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dads-dl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    dt.dads-dt {
      color: var(--dads-text-muted);
      font-weight: 800;
    }

    dd.dads-dd {
      color: var(--dads-text-primary);
      font-family: 'JetBrains Mono', 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 900;
    }

    /* ===================================================
       セットアップ・待機画面 (layout-setup)
       =================================================== */
    .setup-screen {
      position: absolute;
      top: 0; left: 0; width: 1920px; height: 1080px;
      background: var(--dads-color-bg);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 32px;
    }
    .layout-setup .setup-screen { display: flex; }

    .setup-card {
      width: 1040px;
      text-align: center;
      padding: 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border: 4px solid var(--dads-blue-900);
    }
  </style>
</head>
<body>

  <div class="overlay-viewport" id="overlayRoot">
    
    <!-- 左カラム (幅1440px × 高さ1040px) -->
    <div class="left-column">
      
      <!-- ゲーム画面枠 (1440x810 16:9) -->
      <div id="gameScreenWrapper"></div>

      <!-- 左下フッター (1440x214) -->
      <div class="bottom-bar">
        
        <!-- イベント情報 ＆ DADS 公式 Notification Banner -->
        <div class="dads-card event-info-card">
          <div class="event-header-row">
            <div>
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                <span class="dads-tag tag-blue">
                  <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2zm0-10h2v8h-2z"/></svg></span>
                  RTA 生放送
                </span>
                <span class="dads-tag tag-red">
                  <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#be123c;"></span>
                  LIVE
                </span>
              </div>
              <div class="event-title" id="eventName">RTA Event Speedrun</div>
            </div>
            <div style="text-align: right;">
              <div class="event-hashtag" id="eventHashtag">#RTA_Event</div>
            </div>
          </div>

          <!-- DADS 公式 Notification Banner (お知らせ速報) -->
          <div class="dads-notification-banner" id="announcementBanner">
            <div class="dads-notification-banner__icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
            <div class="dads-notification-banner__text" id="announcementText">
              ただいま配信中！公式ハッシュタグで応援ポストをお願いします！
            </div>
          </div>

        </div>

        <!-- 走者カメラ / 手元小窓 (DADS 公式 Camera SVG) -->
        <div class="dads-card camera-card" id="cameraSlot">
          <div style="width: 44px; height: 44px; color: var(--dads-blue-900);">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </div>
          <div>走者カメラ</div>
        </div>

      </div>
    </div>

    <!-- 右カラム (サイドバー: 幅424px × 高さ1040px) -->
    <div class="sidebar-column">
      
      <!-- 1. タイマーカード (特大70px) -->
      <div class="dads-card timer-card" id="timerCard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="dads-tag tag-blue" id="timerBadge">
            <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></span>
            タイマー
          </span>
          <span style="font-size: 15px; color: var(--dads-text-secondary); font-weight: 800;">
            予定 <b style="color: var(--dads-text-primary); font-family: 'JetBrains Mono', monospace; font-size: 18px;" id="gameEst">00:00:00</b>
          </span>
        </div>
        <div class="timer-value" id="timerDisplay">00:00:00</div>
      </div>

      <!-- 2. ゲーム＆走者情報カード -->
      <div class="dads-card info-card">
        
        <div class="game-header">
          <span class="dads-tag tag-blue" style="align-self: flex-start;">
            <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></span>
            作品名
          </span>
          <div class="game-title-text" id="gameTitle">Super Mario 64</div>
          <div class="game-category-text" id="gameCategory">16 Star</div>
        </div>

        <div class="profile-group">
          <!-- 走者 -->
          <div class="profile-item">
            <div class="profile-icon-wrap">
              <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
            </div>
            <div>
              <div class="profile-role-tag">走者 (RUNNER)</div>
              <div class="profile-name-text" id="runnerName">ひなめが</div>
            </div>
          </div>

          <!-- 解説者 -->
          <div class="profile-item" style="background: #ffffff;">
            <div class="profile-icon-wrap" style="background: #e2e8f0; color: #475569;">
              <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></span>
            </div>
            <div>
              <div class="profile-role-tag">解説 (COMMENTATOR)</div>
              <div class="profile-name-text" id="commentatorName">なし</div>
            </div>
          </div>
        </div>

        <!-- DADS 公式 Definition List -->
        <dl class="dads-definition-list">
          <div class="dads-dl-row">
            <dt class="dads-dt">プレイ機種</dt>
            <dd class="dads-dd" id="gamePlatform">N64実機</dd>
          </div>
          <div class="dads-dl-row">
            <dt class="dads-dt">画面比率</dt>
            <dd class="dads-dd" id="gameAspect">16:9</dd>
          </div>
        </dl>

      </div>

    </div>

    <!-- セットアップ・待機画面 (layout-setup) -->
    <div class="setup-screen" id="setupScreen">
      <div class="dads-card setup-card">
        <span class="dads-tag tag-blue" style="align-self: center; font-size: 18px; padding: 6px 20px;">
          <span class="dads-icon"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></span>
          UP NEXT • 次のゲーム
        </span>
        <div class="game-title-text" id="setupGameTitle" style="font-size: 46px; color: var(--dads-blue-900);">GAME TITLE</div>
        <div class="game-category-text" id="setupGameCategory" style="font-size: 26px; color: var(--dads-text-secondary);">Category (EST: 00:00:00)</div>
        
        <div class="profile-item" style="align-self: center; min-width: 420px; justify-content: center; margin-top: 16px; padding: 16px 24px;">
          <div class="profile-icon-wrap" style="width: 48px; height: 48px;">
            <span class="dads-icon" style="width: 30px; height: 30px;"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
          </div>
          <div>
            <div class="profile-role-tag" style="font-size: 15px;">走者</div>
            <div class="profile-name-text" id="setupRunnerName" style="font-size: 28px;">Runner Name</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const timerRep = nodecg.Replicant('timer');
    const currentRunRep = nodecg.Replicant('currentRun');
    const layoutRep = nodecg.Replicant('layout');
    const eventInfoRep = nodecg.Replicant('eventInfo');
    const announcementRep = nodecg.Replicant('announcement');

    const overlayRoot = document.getElementById('overlayRoot');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerCard = document.getElementById('timerCard');

    // 1. タイマー
    timerRep.on('change', (val) => {
      if (!val) return;
      timerDisplay.innerText = val.formatted || '00:00:00';
      
      timerCard.className = 'dads-card timer-card';
      if (val.status === 'running') timerCard.classList.add('timer-running');
      if (val.status === 'finished') timerCard.classList.add('timer-finished');
      if (val.status === 'paused') timerCard.classList.add('timer-paused');
    });

    // 2. 走者＆ゲーム情報
    currentRunRep.on('change', (run) => {
      if (!run) return;
      const gameTitle = run.game?.title || '-';
      const category = run.game?.category || '-';
      const runner = run.runner?.name || '-';
      const est = run.game?.est || '00:00:00';
      const platform = run.game?.platform || '-';
      const aspect = run.game?.aspect_ratio || '16:9';
      const commentator = run.commentator?.name || (typeof run.commentator === 'string' ? run.commentator : 'なし');

      document.getElementById('gameTitle').innerText = gameTitle;
      document.getElementById('gameCategory').innerText = category;
      document.getElementById('runnerName').innerText = runner;
      document.getElementById('gameEst').innerText = est;
      document.getElementById('gamePlatform').innerText = platform;
      document.getElementById('gameAspect').innerText = aspect;
      document.getElementById('commentatorName').innerText = commentator;

      document.getElementById('setupGameTitle').innerText = gameTitle;
      document.getElementById('setupGameCategory').innerText = `${category} (EST: ${est})`;
      document.getElementById('setupRunnerName').innerText = runner;
    });

    // 3. レイアウト
    layoutRep.on('change', (layout) => {
      overlayRoot.className = 'overlay-viewport';
      if (layout === '4:3') overlayRoot.classList.add('layout-4-3');
      if (layout === 'setup') overlayRoot.classList.add('layout-setup');
    });

    // 4. イベント情報
    eventInfoRep.on('change', (info) => {
      if (!info) return;
      if (info.name) document.getElementById('eventName').innerText = info.name;
      if (info.hashtag) document.getElementById('eventHashtag').innerText = info.hashtag;
    });

    // 5. DADS 公式お知らせバナー同期
    announcementRep.on('change', (ann) => {
      if (!ann) return;
      const bannerEl = document.getElementById('announcementBanner');
      const textEl = document.getElementById('announcementText');
      if (textEl) textEl.innerText = ann.text || '';
      if (bannerEl) bannerEl.style.display = ann.visible ? 'flex' : 'none';
    });
  </script>
</body>
</html>
