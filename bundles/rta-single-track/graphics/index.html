<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RTA Speedrun Broadcast - Digital Agency Public Light Edition</title>
  <!-- Google Fonts: Noto Sans JP (太字・高可読性), Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Noto+Sans+JP:wght@400;600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       デジタル庁デザインシステム (DADS) 準拠 - 公共サイン・ライトテーマ
       ========================================================================== */
    :root {
      /* クリーンな公共ライトパレット */
      --dads-bg: #e2e8f0;            /* 優しいスレートグレー */
      --dads-surface: #ffffff;       /* ピュアホワイト */
      --dads-surface-subtle: #f8fafc;/* 薄いオフホワイト */
      --dads-border: #cbd5e1;        /* クッキリした境界線 */
      --dads-border-strong: #94a3b8; /* 2pxの強調境界線 */
      
      /* デジタル庁標準カラー */
      --dads-blue-primary: #004ea2;  /* デジ庁ブルー */
      --dads-blue-light: #e0f2fe;
      --dads-text-main: #0f172a;     /* 濃い墨色 (高コントラスト) */
      --dads-text-secondary: #475569;
      --dads-text-muted: #64748b;
      
      /* ステータスカラー (公共サイン基準) */
      --dads-green: #059669;         /* 進行中 (Running) */
      --dads-green-bg: #d1fae5;
      --dads-gold: #d97706;          /* 完走 (Finished) */
      --dads-gold-bg: #fef3c7;
      --dads-red: #e11d48;           /* 停止 (Paused) */
      --dads-red-bg: #ffe4e6;
      
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      color: var(--dads-text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* 1920x1080 ピクセルパーフェクト グリッド (外周20px / 隙間16px) */
    .overlay-viewport {
      width: 1920px;
      height: 1080px;
      padding: 20px;
      background: var(--dads-bg);
      display: grid;
      grid-template-columns: 1440px 424px;
      gap: 16px;
      position: relative;
    }

    /* 公共カード (白背景 + クッキリ境界線 + 優しいソフトシャドウ) */
    .dads-card {
      background: var(--dads-surface);
      border: 2px solid var(--dads-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      position: relative;
      overflow: hidden;
    }

    /* 公共タグ・バッジ */
    .dads-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Noto Sans JP', 'Outfit', sans-serif;
    }

    .tag-blue { background: var(--dads-blue-light); color: var(--dads-blue-primary); border: 1px solid #bae6fd; }
    .tag-green { background: var(--dads-green-bg); color: var(--dads-green); border: 1px solid #a7f3d0; }
    .tag-gold { background: var(--dads-gold-bg); color: var(--dads-gold); border: 1px solid #fde68a; }
    .tag-red { background: var(--dads-red-bg); color: var(--dads-red); border: 1px solid #fecdd3; }

    /* ===================================================
       左カラム (幅1440px × 高さ1040px)
       =================================================== */
    .left-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 1040px;
    }

    /* ゲーム画面枠 (1440x810 16:9最大化) */
    #gameScreenWrapper {
      width: 1440px;
      height: 810px;
      background: #000;
      border: 3px solid #334155;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
      flex-shrink: 0;
      position: relative;
    }

    /* 4:3 レトロ時 */
    .layout-4-3 #gameScreenWrapper {
      width: 1080px;
      height: 810px;
    }

    /* 左下フッター (1440x214 下端完全一致！) */
    .bottom-bar {
      flex: 1;
      height: 214px;
      display: flex;
      gap: 16px;
    }

    .event-info-card {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid var(--dads-blue-primary);
    }

    .event-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--dads-blue-primary);
      letter-spacing: -0.3px;
    }

    .event-hashtag {
      font-size: 15px;
      color: var(--dads-text-secondary);
      font-weight: 700;
      margin-top: 4px;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
    }

    /* 走者カメラ / 手元小窓 */
    .camera-card {
      width: 285px;
      height: 100%;
      background: #f1f5f9;
      border: 2px dashed var(--dads-border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--dads-text-muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* ===================================================
       右カラム (サイドバー: 幅424px × 高さ1040px 下端完全一致！)
       =================================================== */
    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 1040px;
    }

    /* 1. タイマーカード */
    .timer-card {
      padding: 20px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 5px solid var(--dads-blue-primary);
    }

    .timer-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1px;
      font-feature-settings: "tnum";
      color: var(--dads-text-main);
      margin: 4px 0;
      transition: color 0.2s ease;
    }

    .timer-running .timer-value { color: var(--dads-green); }
    .timer-running { border-top-color: var(--dads-green); }
    .timer-finished .timer-value { color: var(--dads-gold); }
    .timer-finished { border-top-color: var(--dads-gold); }
    .timer-paused .timer-value { color: var(--dads-red); }
    .timer-paused { border-top-color: var(--dads-red); }

    /* 2. ゲーム＆走者情報カード */
    .info-card {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-title-text {
      font-size: 24px;
      font-weight: 900;
      color: var(--dads-text-main);
      line-height: 1.3;
      margin-top: 6px;
      letter-spacing: -0.4px;
    }

    .game-category-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--dads-blue-primary);
    }

    /* プロファイル行 (走者 & 解説者) */
    .profile-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--dads-surface-subtle);
      border: 1.5px solid var(--dads-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }

    .profile-icon {
      font-size: 22px;
    }

    .profile-role-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--dads-text-muted);
      text-transform: uppercase;
    }

    .profile-name-text {
      font-size: 17px;
      font-weight: 900;
      color: var(--dads-text-main);
    }

    /* メタデータリスト (EST, 機種, アスペクト比) */
    .meta-list {
      background: #f1f5f9;
      border: 1.5px solid var(--dads-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .meta-label {
      color: var(--dads-text-muted);
      font-weight: 700;
    }

    .meta-value {
      color: var(--dads-text-main);
      font-family: 'JetBrains Mono', 'Noto Sans JP', sans-serif;
      font-weight: 800;
    }

    /* ===================================================
       セットアップ・待機画面 (layout-setup)
       =================================================== */
    .setup-screen {
      position: absolute;
      top: 0; left: 0; width: 1920px; height: 1080px;
      background: #e2e8f0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 32px;
    }
    .layout-setup .setup-screen { display: flex; }

    .setup-card {
      width: 960px;
      text-align: center;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 3px solid var(--dads-blue-primary);
    }
  </style>
</head>
<body>

  <div class="overlay-viewport" id="overlayRoot">
    
    <!-- 左カラム (幅1440px × 高さ1040px) -->
    <div class="left-column">
      
      <!-- ゲーム画面枠 (1440x810 16:9) -->
      <div id="gameScreenWrapper"></div>

      <!-- 左下フッター (1440x214) -->
      <div class="bottom-bar">
        
        <!-- イベント情報カード -->
        <div class="dads-card event-info-card">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
              <span class="dads-tag tag-blue">RTA イベント生放送</span>
              <span class="dads-tag tag-red">● LIVE</span>
            </div>
            <div class="event-title" id="eventName">RTA Event Speedrun</div>
            <div class="event-hashtag" id="eventHashtag">#RTA_Event</div>
          </div>
          <div style="text-align: right;">
            <span class="dads-tag tag-blue" style="font-size: 13px;">TRACK 01</span>
          </div>
        </div>

        <!-- 走者カメラ / 手元小窓 -->
        <div class="dads-card camera-card" id="cameraSlot">
          <div style="font-size: 24px;">📷</div>
          <div>走者カメラ枠</div>
        </div>

      </div>
    </div>

    <!-- 右カラム (サイドバー: 幅424px × 高さ1040px) -->
    <div class="sidebar-column">
      
      <!-- 1. タイマーカード -->
      <div class="dads-card timer-card" id="timerCard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="dads-tag tag-blue" id="timerBadge">タイマー</span>
          <span style="font-size: 13px; color: var(--dads-text-secondary); font-weight: 700;">
            予定タイム <b style="color: var(--dads-text-main); font-family: 'JetBrains Mono', monospace;" id="gameEst">00:00:00</b>
          </span>
        </div>
        <div class="timer-value" id="timerDisplay">00:00:00</div>
      </div>

      <!-- 2. ゲーム＆走者情報カード -->
      <div class="dads-card info-card">
        
        <div class="game-header">
          <span class="dads-tag tag-blue" style="align-self: flex-start;">プレイ作品</span>
          <div class="game-title-text" id="gameTitle">Super Mario 64</div>
          <div class="game-category-text" id="gameCategory">16 Star</div>
        </div>

        <div class="profile-group">
          <!-- 走者 -->
          <div class="profile-item">
            <div class="profile-icon">🎮</div>
            <div>
              <div class="profile-role-tag">走者 (RUNNER)</div>
              <div class="profile-name-text" id="runnerName">ひなめが</div>
            </div>
          </div>

          <!-- 解説者 -->
          <div class="profile-item" style="background: #ffffff;">
            <div class="profile-icon">🎙️</div>
            <div>
              <div class="profile-role-tag">解説 (COMMENTATOR)</div>
              <div class="profile-name-text" id="commentatorName">なし</div>
            </div>
          </div>
        </div>

        <!-- メタ情報 -->
        <div class="meta-list">
          <div class="meta-row">
            <span class="meta-label">プレイ機種</span>
            <span class="meta-value" id="gamePlatform">N64実機</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">画面比率</span>
            <span class="meta-value" id="gameAspect">16:9</span>
          </div>
        </div>

      </div>

    </div>

    <!-- セットアップ・待機画面 (layout-setup) -->
    <div class="setup-screen" id="setupScreen">
      <div class="dads-card setup-card">
        <span class="dads-tag tag-blue" style="align-self: center; font-size: 14px;">UP NEXT • 次のゲーム</span>
        <div class="game-title-text" id="setupGameTitle" style="font-size: 40px; color: var(--dads-blue-primary);">GAME TITLE</div>
        <div class="game-category-text" id="setupGameCategory" style="font-size: 22px; color: var(--dads-text-secondary);">Category (EST: 00:00:00)</div>
        
        <div class="profile-item" style="align-self: center; min-width: 360px; justify-content: center; margin-top: 12px;">
          <div class="profile-icon">🏃‍♂️</div>
          <div>
            <div class="profile-role-tag">走者</div>
            <div class="profile-name-text" id="setupRunnerName" style="font-size: 22px;">Runner Name</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const timerRep = nodecg.Replicant('timer');
    const currentRunRep = nodecg.Replicant('currentRun');
    const layoutRep = nodecg.Replicant('layout');
    const eventInfoRep = nodecg.Replicant('eventInfo');

    const overlayRoot = document.getElementById('overlayRoot');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerCard = document.getElementById('timerCard');

    // 1. タイマー
    timerRep.on('change', (val) => {
      if (!val) return;
      timerDisplay.innerText = val.formatted || '00:00:00';
      
      timerCard.className = 'dads-card timer-card';
      if (val.status === 'running') timerCard.classList.add('timer-running');
      if (val.status === 'finished') timerCard.classList.add('timer-finished');
      if (val.status === 'paused') timerCard.classList.add('timer-paused');
    });

    // 2. 走者＆ゲーム情報
    currentRunRep.on('change', (run) => {
      if (!run) return;
      const gameTitle = run.game?.title || '-';
      const category = run.game?.category || '-';
      const runner = run.runner?.name || '-';
      const est = run.game?.est || '00:00:00';
      const platform = run.game?.platform || '-';
      const aspect = run.game?.aspect_ratio || '16:9';
      const commentator = run.commentator?.name || (typeof run.commentator === 'string' ? run.commentator : 'なし');

      document.getElementById('gameTitle').innerText = gameTitle;
      document.getElementById('gameCategory').innerText = category;
      document.getElementById('runnerName').innerText = runner;
      document.getElementById('gameEst').innerText = est;
      document.getElementById('gamePlatform').innerText = platform;
      document.getElementById('gameAspect').innerText = aspect;
      document.getElementById('commentatorName').innerText = commentator;

      document.getElementById('setupGameTitle').innerText = gameTitle;
      document.getElementById('setupGameCategory').innerText = `${category} (EST: ${est})`;
      document.getElementById('setupRunnerName').innerText = runner;
    });

    // 3. レイアウト
    layoutRep.on('change', (layout) => {
      overlayRoot.className = 'overlay-viewport';
      if (layout === '4:3') overlayRoot.classList.add('layout-4-3');
      if (layout === 'setup') overlayRoot.classList.add('layout-setup');
    });

    // 4. イベント情報
    eventInfoRep.on('change', (info) => {
      if (!info) return;
      if (info.name) document.getElementById('eventName').innerText = info.name;
      if (info.hashtag) document.getElementById('eventHashtag').innerText = info.hashtag;
    });
  </script>
</body>
</html>
